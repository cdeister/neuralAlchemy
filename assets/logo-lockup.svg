<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <!-- Neural Alchemy horizontal lockup: mark + wordmark + tagline.
       Wordmark uses Archivo (falls back to Helvetica/Arial); for print,
       outline the text in a vector editor. -->
  <g stroke="#4d473c" stroke-width="1.25">
    <line x1="150" y1="34"  x2="150" y2="44"/>
    <line x1="150" y1="256" x2="150" y2="266"/>
    <line x1="34"  y1="150" x2="44"  y2="150"/>
    <line x1="256" y1="150" x2="266" y2="150"/>
  </g>
  <g fill="none" stroke="#16130e" stroke-width="2.5" stroke-linejoin="round">
    <circle cx="150" cy="150" r="100"/>
    <path d="M150 50 L63.4 200 L236.6 200 Z"/>
    <rect x="109.8" y="119.6" width="80.4" height="80.4"/>
  </g>
  <circle cx="150" cy="159.8" r="40.2" fill="#c8401a"/>

  <text x="320" y="158" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="64" letter-spacing="4" fill="#16130e">NEURAL ALCHEMY</text>
  <text x="323" y="205" font-family="'IBM Plex Mono', Menlo, monospace"
        font-size="21" letter-spacing="7.5" fill="#16130e">RESEARCH<tspan fill="#c8401a">,</tspan> ART<tspan fill="#c8401a">,</tspan> STUDIO</text>
</svg>
